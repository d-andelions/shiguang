{% extends "base.html" %}
{% block title %}登录{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>登录</h1>
  <form method="post">
    <label class="field">
      <span>用户名</span>
      <input type="text" name="username" required autofocus
             value="{{ form.get('username', '') if form else '' }}">
    </label>
    <label class="field">
      <span>密码</span>
      <input type="password" name="password" required>
    </label>
    <button class="btn btn-primary btn-block" type="submit">登录</button>
  </form>
  <p class="auth-alt">还没有账号？<a href="{{ url_for('register') }}">去注册</a></p>
  <p class="hint">演示账号：demo1 / shiguang123、demo2 / shiguang123</p>
</div>
{% endblock %}
