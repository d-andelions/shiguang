{% extends "base.html" %}
{% block title %}编辑物品{% endblock %}

{% block content %}
<div class="page-card">
  <h1 class="page-title">编辑物品</h1>
  <p class="page-sub">仅发布者本人可编辑（服务端已做归属校验，他人访问会被拒绝）</p>
  <form method="post" enctype="multipart/form-data">
    {% include "_item_form.html" %}
    <label class="field">
      <span>当前状态</span>
      <select name="status">
        {% for s in STATUSES %}
          <option value="{{ s }}" {{ 'selected' if (form.get('status') if form else item.status) == s }}>{{ s }}</option>
        {% endfor %}
      </select>
    </label>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">保存修改</button>
      <a class="btn btn-ghost" href="{{ url_for('item_detail', item_id=item.id) }}">返回详情</a>
    </div>
  </form>
</div>
{% endblock %}
